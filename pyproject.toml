[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BookerPubTool"
version = "2026.3.25.0"
description = "PYPI book publisher for ApacheCN"
readme = "README.md"
license = {text = "SATA"}
requires-python = ">=3.6"
authors = [
    {name = "wizardforcel", email = "wizard.z@qq.com"},
]
keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Documentation",
    "Topic :: Documentation",
]
dependencies = [
    "requests",
    "pyquery",
    "twine",
    "wheel",
    "jieba",
    "xpinyin",
]

[project.urls]
Homepage = "https://github.com/apachecn/BookerPubTool"

[project.scripts]
BookerPubTool = "BookerPubTool.__main__:main"
bpt = "BookerPubTool.__main__:main"
pub-tool = "BookerPubTool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BookerPubTool*"]

[tool.setuptools.package-data]
"*" = ["*"]
